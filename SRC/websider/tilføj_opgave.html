<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"> 
        <title>Opgaveplanner</title>
        <link rel="stylesheet" type="text/css" href="../styles.css">
        <script type="module" src="../index.js"></script>
    </head>

    <body>
        <div id="menu-container"></div>

        <h1>Tilføj opgave</h1>
        <h2>Tilføj en ny opgave i feltet herunder</h2>
        <form id="opgaveForm">
            <input type="text" id="opgaveTitel" placeholder="Opgave titel" required>
            <textarea id="opgaveBeskrivelse" placeholder="Opgave beskrivelse" required></textarea>
            <button type="submit">Tilføj opgave</button>
        </form>
    </body>
</html>
