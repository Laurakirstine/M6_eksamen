<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"> 
        <title>Opgaveplanner</title>
        <link rel="stylesheet" type="text/css" href="../styles.css">
        <script type="module" src="../index.js"></script>
    </head>

     <body>
        <!-- Navigationsbar -->
        <div id="menu-container"></div>
        
        <h1>Igangværende opgaver</h1>
        <h2>Her kan du se en liste over alle dine igangværende opgaver</h2>
        
        <!-- sorterings/ filtrerings drop-down menu -->
        <div class="sort-container">
            <label for="sort-select">Sorter efter:</label>
            <select id="sort-select">
                <option value="none">Ingen sortering</option>
                <option value="alphabetical">Alfabetisk</option>
                <option value="date-asc">Dato (tidligste først)</option>
                <option value="date-desc">Dato (seneste først)</option>
            </select>
        </div>
        
        <!-- Igangværende opgaver vil blive indsat her -->
        <div id="tasks-list"></div>
    </body>
